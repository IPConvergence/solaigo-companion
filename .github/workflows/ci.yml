name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Pinned to a current version. Phase 1 uses stdlib only; bump when a
          # dependency pushes the floor higher.
          go-version: '1.27'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o solaigo-companion ./cmd/companion
        shell: bash

      - name: Run --version to confirm the binary works
        shell: bash
        run: ./solaigo-companion version
